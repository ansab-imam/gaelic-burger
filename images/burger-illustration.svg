<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Illustrated burger with an Irish flag pick</title>
  <defs>
    <path id="h" d="M0 0C-7-7-19-15-19-27C-19-35-13-40-7.5-40C-3.5-40 0-37 0-33C0-37 3.5-40 7.5-40C13-40 19-35 19-27C19-15 7-7 0 0Z"/>
    <g id="s"><use href="#h"/><use href="#h" transform="rotate(120)"/><use href="#h" transform="rotate(240)"/></g>
  </defs>
  <!-- backdrop burst -->
  <circle cx="200" cy="215" r="165" fill="#4fa32f"/>
  <g stroke="#7cc24f" stroke-width="10" stroke-linecap="round" opacity=".7">
    <path d="M200 20v28M200 382v28M5 215h28M367 215h28M62 77l20 20M318 333l20 20M62 353l20-20M318 97l20-20"/>
  </g>
  <g stroke="#0b2a1d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
