    <path d="M68 220h264l-4 22h-24l-8 30-14-30h-50l-9 40-14-40h-62l-8 26-14-26H74z" fill="#ffc93c"/>
    <!-- lettuce -->
    <path d="M58 214q14-18 28 0t28 0 28 0 28 0 28 0 28 0 28 0 28 0 28 0 28 0q8 14-8 16H66q-16-2-8-16z" fill="#7cc24f"/>
    <!-- top bun -->
    <path d="M66 204q0-110 134-110t134 110z" fill="#e8973a"/>
  </g>
  <!-- bun shine + seeds -->
  <path d="M110 160q10-40 60-52" fill="none" stroke="#f6c27a" stroke-width="10" stroke-linecap="round"/>
  <g fill="#fff3d6" stroke="#0b2a1d" stroke-width="2.5">
    <ellipse cx="160" cy="140" rx="7" ry="4" transform="rotate(-20 160 140)"/>
    <ellipse cx="205" cy="124" rx="7" ry="4" transform="rotate(10 205 124)"/>
    <ellipse cx="248" cy="142" rx="7" ry="4" transform="rotate(25 248 142)"/>
    <ellipse cx="190" cy="165" rx="7" ry="4" transform="rotate(-8 190 165)"/>
    <ellipse cx="236" cy="176" rx="7" ry="4" transform="rotate(18 236 176)"/>
    <ellipse cx="142" cy="182" rx="7" ry="4" transform="rotate(-25 142 182)"/>
    <ellipse cx="282" cy="180" rx="7" ry="4" transform="rotate(30 282 180)"/>
  </g>
  <g stroke="#0b2a1d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
