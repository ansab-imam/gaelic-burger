    <!-- bottom bun -->
    <path d="M78 300h244q0 44-38 44H116q-38 0-38-44z" fill="#e8973a"/>
    <!-- tomato -->
    <rect x="72" y="282" width="256" height="20" rx="10" fill="#e8473a"/>
    <!-- patty -->
    <rect x="66" y="232" width="268" height="54" rx="27" fill="#6b3a1e"/>
    <path d="M104 250l14 18M150 248l14 20M198 248l14 20M246 248l14 20M290 250l12 16" stroke="#3e200f" stroke-width="5"/>
