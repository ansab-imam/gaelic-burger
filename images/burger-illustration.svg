  <g fill="#fff" stroke="#0b2a1d" stroke-width="5" stroke-linejoin="round">
    <use href="#s" transform="translate(70 92) scale(.55) rotate(-20)"/>
    <use href="#s" transform="translate(342 138) scale(.42) rotate(25)"/>
    <use href="#s" transform="translate(352 300) scale(.35) rotate(-10)"/>
