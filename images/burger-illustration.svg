    <path d="M200 52v100" fill="none"/>
    <path d="M200 54h22v38h-22z" fill="#4fa32f"/>
    <path d="M222 54h22v38h-22z" fill="#fff"/>
    <path d="M244 54h22v38h-22z" fill="#ff883e"/>
